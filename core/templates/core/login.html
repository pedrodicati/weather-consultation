{% extends 'core/base.html' %}

{% block title %}Login - Weather App{% endblock %}

{% block content %}
    <h2>Login</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
    </form>
    <p>Não tem uma conta? <a href="{% url 'register' %}">Registre-se aqui</a>.</p>
{% endblock %}
