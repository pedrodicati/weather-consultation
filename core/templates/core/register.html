{% extends 'core/base.html' %}

{% block title %}Registrar - Weather App{% endblock %}

{% block content %}
    <h2>Registrar Novo Usuário</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Registrar</button>
    </form>
    <p>Já tem uma conta? <a href="{% url 'login' %}">Faça login aqui</a>.</p>
{% endblock %}
